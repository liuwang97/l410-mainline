# L410 kernel bring-up (l410-mainline). Boot once with: grub-reboot l410-test
menuentry 'L410 test kernel (Debian 13 sdd7)' --id l410-test {
    # grubenv l410_fallback=<entry id>: whatever reboot follows this test boot (crash, deadman,
    # auto-revert) goes once to that entry instead of the default, e.g. kylin2403 on the home
    # WLAN where the default 2203 has no network. Unset = old behaviour.
    load_env l410_fallback
    if [ -n "${l410_fallback}" ]; then
        set next_entry="${l410_fallback}"
        save_env next_entry
    fi
    insmod part_gpt
    insmod ext2
    insmod fdt
    search --no-floppy --fs-uuid --set=root $DEB_UUID
    source /boot/l410/boot.cfg
}
