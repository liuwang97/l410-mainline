# /etc/sysctl.d/90-l410-net.conf (system/hardware)
# fq_codel on every new interface queue: short queues under upload load (WiFi uploads no
# longer delay web pages and calls). sch_fq_codel is a module; the kernel loads it when
# this is set.
net.core.default_qdisc = fq_codel
# unprivileged ICMP echo sockets for ping (forky's iputils-ping has no file capability;
# systemd upstream sets the same range in 50-default.conf, which Debian does not ship)
net.ipv4.ping_group_range = 0 2147483647
