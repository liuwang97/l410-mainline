# UCM2 for the Huawei L410 (Kirin 990): Hi6405 codec over SLIMbus/ASP DMA,
# two TAS2562 speaker amplifiers on the codec's I2S4, internal DMICs.
# Card driver name "hi6405" (sound/soc/hisilicon/hi6405/hi6405_card.c).
# Install: copy system/hardware/ucm2 to /usr/share/alsa/ucm2 (merge).

Syntax 4

SectionUseCase."HiFi" {
	File "/conf.d/hi6405/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	cset "name='Speaker Playback Switch' off"
	cset "name='Headset Playback Switch' off"
	cset "name='Mic Capture Switch' off"
	cset "name='Headset Mic Capture Switch' off"
	cset "name='Left ASI1 Sel' Left"
	cset "name='Right ASI1 Sel' Right"
]
