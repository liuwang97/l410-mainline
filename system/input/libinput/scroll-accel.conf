# L410 touchpad two-finger scroll acceleration (libinput patch, system/input/libinput/).
# Installed as /etc/l410/scroll-accel.conf. Re-read when a scroll starts after the file
# changed: edit, then scroll again (no relogin). docs/tuning/touchpad-scroll.md.
#
# point <finger speed, mm/s> <gain>: piecewise linear, gain held after the last point. The gain
# multiplies libinput's scroll value (10.52 per mm of finger travel). With KDE's scroll speed
# at 1.0 and Chromium's WaylandUnscaledTouchpadScrolling, 1.0 = 10.5 logical px per mm =
# 2.16 mm of page per mm of finger on the L410 panel at 150 %.
#
# Curve: ChromeOS's default (gestures library, accel_filter_interpreter.cc, "Scroll
# Sensitivity" 3): gain 1 to 75 mm/s, v/75 to 600 mm/s (8x), then 1 + 4200/v. ChromeOS's
# slow-speed gain, 2.5 mm of page per finger mm at 133 DIP/inch, is close to ours (2.16), so it
# carries over 1:1. Changed here:
#   - the knee starts at 45 mm/s and blends into v/75 by 105 mm/s (1 + (v-45)^2/9000; macOS
#     starts its rise right away, ChromeOS has a corner at 75);
#   - over 500..700 mm/s the output speed's slope eases from 2v/75 to 1 instead of dropping at
#     600: peak 7.26x at 600, then ChromeOS's 1 + 4066.7/v (output speed keeps rising);
#   - points sampled so that output speed (v x gain) never decreases.
enabled 1
window_ms 50	# speed = finger travel over the last 50 ms of the stroke
gap_ms 100	# a longer pause starts a new stroke

point    0  1.0
point   45  1.0
point   55  1.011
point   65  1.044
point   75  1.1
point   85  1.178
point   95  1.278
point  105  1.4
point  150  2.0
point  200  2.667
point  300  4.0
point  400  5.333
point  500  6.667
point  550  7.133
point  600  7.264
point  650  7.138
point  700  6.81
point  800  6.083
point  900  5.519
point 1000  5.067
point 1200  4.389
point 1500  3.711
point 2000  3.033

# Presets: /usr/local/share/l410/scroll-accel-*.conf (gentle: half the acceleration).
# No acceleration: enabled 0
