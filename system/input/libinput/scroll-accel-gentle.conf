# L410 touchpad scroll acceleration, gentle preset: half the acceleration of the default
# (gain = 1 + (default - 1) / 2, peak 4.1x at 600 mm/s). To use it:
#   sudo cp /usr/local/share/l410/scroll-accel-gentle.conf /etc/l410/scroll-accel.conf
# Format and the default curve: /usr/local/share/l410/scroll-accel-default.conf.
enabled 1
window_ms 50
gap_ms 100

point    0  1.0
point   45  1.0
point   55  1.006
point   65  1.022
point   75  1.05
point   85  1.089
point   95  1.139
point  105  1.2
point  150  1.5
point  200  1.833
point  300  2.5
point  400  3.167
point  500  3.833
point  550  4.067
point  600  4.132
point  650  4.069
point  700  3.905
point  800  3.542
point  900  3.26
point 1000  3.033
point 1200  2.695
point 1500  2.356
point 2000  2.017
