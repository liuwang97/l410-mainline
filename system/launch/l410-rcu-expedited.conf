# /etc/tmpfiles.d/l410-rcu-expedited.conf: expedited RCU grace periods. Application start-up waits on
# synchronize_rcu() (sandbox namespaces, cgroup moves); expedited grace periods take microseconds
# instead of several milliseconds. A/B on the L410 (docs/tuning/launch-latency.md): WPS -14 %, QQ -8 %,
# System Settings -4 %, Chromium and Firefox -3 %.
w /sys/kernel/rcu_expedited - - - - 1
