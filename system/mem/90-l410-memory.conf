# /etc/sysctl.d/90-l410-memory.conf (docs/tuning/memory.md)
# systemd-sysctl has no end-of-line comments: comments stay on their own lines.

# anonymous and file pages weigh the same; the multi-gen LRU balances them by refaults
vm.swappiness = 100
# no swap-in readahead: reading neighbours from zswap is synchronous decompression
vm.page-cluster = 0
# watermark gap 1% of RAM (~80 MB): kswapd starts earlier, allocations rarely reclaim directly
vm.watermark_scale_factor = 100
# no reclaim bursts on fragmentation events
vm.watermark_boost_factor = 0
# background writeback from 64 MB of dirty data, writers throttled at 256 MB
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
