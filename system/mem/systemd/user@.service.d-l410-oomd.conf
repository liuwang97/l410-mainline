# /etc/systemd/system/user@.service.d/l410-oomd.conf
# systemd-oomd kills the user's worst cgroup (an app-*.scope/.service) when memory pressure
# stays above 50% for DefaultMemoryPressureDurationSec
[Unit]
Wants=l410-oomd-resync@%i.timer

[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
