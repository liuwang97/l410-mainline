# /etc/systemd/system/user@.service.d/l410-uclamp.conf
# Let cpu.uclamp.min through the ancestors of the user's cgroups (docs/tuning/perf-power.md)
[Service]
ExecStartPost=+/bin/sh -c 'for c in /sys/fs/cgroup/user.slice /sys/fs/cgroup/user.slice/user-%i.slice /sys/fs/cgroup/user.slice/user-%i.slice/user@%i.service; do echo max > $c/cpu.uclamp.min 2>/dev/null; done; true'
